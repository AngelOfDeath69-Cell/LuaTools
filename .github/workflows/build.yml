name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'LuaToolsGui.sln'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'LuaToolsGui.sln'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore LuaToolsGui.sln

      - name: Run unit tests
        run: dotnet test LuaToolsGui.sln --configuration Release --no-restore --verbosity minimal

      - name: Publish self-contained portable EXE
        shell: pwsh
        run: |
          dotnet publish src/LuaToolsGui/LuaToolsGui.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output publish/win-x64 `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }

      - name: Package and checksum
        shell: pwsh
        run: |
          $publish = 'publish/win-x64'
          $exe = Join-Path $publish 'LuaTools.exe'
          if (-not (Test-Path $exe)) { throw "Expected executable missing: $exe" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = 'dist/LuaTools-win-x64-portable.zip'
          Compress-Archive -Path "$publish/*" -DestinationPath $zip -CompressionLevel Optimal
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$exeHash  LuaTools.exe"
            "$zipHash  LuaTools-win-x64-portable.zip"
          ) | Set-Content 'dist/SHA256SUMS.txt' -Encoding ascii

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LuaTools-win-x64-portable
          path: |
            dist/LuaTools-win-x64-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
